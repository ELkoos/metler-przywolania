# Synology DS1525+: Container Manager -> Projekt -> Utwórz, wskaż ten plik.
# Dane (pracownicy, hasła, dziennik zdarzeń) w folderze ./dane obok tego pliku.
services:
  przywolania:
    image: ghcr.io/elkoos/metler-przywolania-serwer:latest
    container_name: przywolania
    pull_policy: always   # przy każdym uruchomieniu pobiera aktualny obraz (inaczej zostaje stary :latest)
    restart: unless-stopped
    ports:
      - "8080:8080"   # HTTP – do wyłączenia, gdy wszystkie urządzenia mają APK z HTTPS
      - "8443:8443"   # HTTPS/WSS
    environment:
      - TZ=Europe/Warsaw
      # Dostęp tylko z sieci magazynu. Włącz dopiero, gdy panel (Tablety i stoły → Adres IP) pokazuje
      # adresy urządzeń z tej sieci; jeśli pokazuje 172.x.x.x, Docker ukrywa prawdziwe adresy i filtr zablokowałby wszystkich.
      # - PRZYW_ALLOW=192.168.0.0/23
    volumes:
      - ./dane:/data
