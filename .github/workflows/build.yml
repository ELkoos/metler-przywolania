name: Budowa

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  serwer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Testy
        working-directory: server
        run: go test ./...
      - name: Budowa (Windows, Linux)
        working-directory: server
        run: |
          VER="${GITHUB_REF_NAME}"
          [[ "$GITHUB_REF" == refs/tags/* ]] || VER="dev-${GITHUB_SHA::7}"
          mkdir -p ../out
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -ldflags "-s -w -X main.version=$VER" -o ../out/przywolania-serwer.exe .
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -ldflags "-s -w -X main.version=$VER" -o ../out/przywolania-serwer-linux-amd64 .
      - uses: actions/upload-artifact@v4
        with:
          name: serwer
          path: out/*

  obraz-docker:
    runs-on: ubuntu-latest
    needs: serwer
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Budowa i publikacja obrazu
        run: |
          IMG=ghcr.io/$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')/metler-przywolania-serwer
          VER="${GITHUB_REF_NAME}"
          [[ "$GITHUB_REF" == refs/tags/* ]] || VER="dev-${GITHUB_SHA::7}"
          docker build --build-arg VERSION=$VER -t $IMG:$VER -t $IMG:latest server
          docker push $IMG:$VER
          docker push $IMG:latest

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Klucz podpisu
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/ks.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/ks.jks" >> $GITHUB_ENV
            echo "ANDROID_KEYSTORE_PASSWORD=$KS_PASS" >> $GITHUB_ENV
            echo "ANDROID_KEY_PASSWORD=$KS_PASS" >> $GITHUB_ENV
            echo "ANDROID_KEY_ALIAS=przywolania" >> $GITHUB_ENV
          elif [ -f android/keystore/przywolania.jks ]; then
            echo "ANDROID_KEYSTORE_FILE=$PWD/android/keystore/przywolania.jks" >> $GITHUB_ENV
            P=$(cat android/keystore/haslo.txt)
            echo "ANDROID_KEYSTORE_PASSWORD=$P" >> $GITHUB_ENV
            echo "ANDROID_KEY_PASSWORD=$P" >> $GITHUB_ENV
            echo "ANDROID_KEY_ALIAS=przywolania" >> $GITHUB_ENV
          else
            echo "::warning::Brak klucza podpisu - APK podpisany kluczem debug (kazda budowa inny podpis)"
            mkdir -p ~/.android
            keytool -genkeypair -keystore ~/.android/debug.keystore -storepass android -keypass android -alias androiddebugkey -keyalg RSA -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
      - name: Budowa APK
        working-directory: android
        run: |
          VER="${GITHUB_REF_NAME#v}"
          [[ "$GITHUB_REF" == refs/tags/* ]] || VER="1.0.0-dev"
          ./gradlew assembleRelease -PappVersionName="$VER" -PappVersionCode="${GITHUB_RUN_NUMBER}"
          mkdir -p ../out && cp app/build/outputs/apk/release/app-release.apk ../out/przywolania.apk
      - uses: actions/upload-artifact@v4
        with:
          name: aplikacja-android
          path: out/przywolania.apk

  wydanie:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [serwer, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: art
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            art/serwer/*
            art/aplikacja-android/przywolania.apk
